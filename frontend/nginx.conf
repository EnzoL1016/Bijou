server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React Router: siempre cae a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend, mismo origen -> evita CORS
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache agresivo para el JS/CSS con hash en el nombre (code splitting)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes de productos (volumen compartido con el backend)
    location /productos/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
